<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Golden Icon Media</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="topbar">
    <span id="title">Services</span>
    <a id="link" href="" target="_blank" rel="noopener noreferrer" aria-label="Open in new tab">↗</a>
  </div>

  <iframe id="frame" src="" title="Service"></iframe>

  <div id="placeholder">
    <p>Click here</p>
    <span class="arrow">↓</span>
  </div>

  <div class="bottombar">
    <button id="open-btn" aria-label="Open services">☰ Services</button>
  </div>

  <div id="backdrop"></div>
  <div id="sheet" role="dialog" aria-modal="true" aria-label="Services">
    <div class="drag-handle"></div>
    <div id="nav"></div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
